---
- name: Netplan must be defined in the inventory
  ansible.builtin.assert:
    that:
      - bastion_netplan.network is defined
    fail_msg: "Set bastion_netplan in host_vars/{{ inventory_hostname }}"

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
    use: systemd

- name: Resolve the hostname to 127.0.1.1 in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"
    insertafter: '^127\.0\.0\.1\s'
    owner: root
    group: root
    mode: '0644'

- name: Set the timezone
  community.general.timezone:
    name: "{{ bastion_timezone }}"

- name: Configure netplan
  ansible.builtin.template:
    src: netplan.yaml.j2
    dest: "{{ bastion_netplan_file }}"
    owner: root
    group: root
    mode: '0600'
    backup: yes
  notify: Apply netplan

- name: Configure sshd
  ansible.builtin.template:
    src: sshd_bastion.conf.j2
    dest: /etc/ssh/sshd_config.d/10-bastion.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Run notified handlers of bastion_base
  ansible.builtin.meta: flush_handlers
